# .gitlab-ci.yml
#
# Cluster chart CI for perkins-deploy-helm-charts.
#
# Pipelines:
#   merge_request_event -> validate every chart (helm template + workload guard)
#   push to main        -> validate + a "deploy" DAG + standalone verify buttons
#
# Deploy DAG (each step `when: manual` where noted):
#   approve:dev (manual) -> (dry-run -> apply) x wave 0..3
#                        -> approve:prod (manual) -> (dry-run -> apply) x wave 0..3
#
# Standalone:
#   verify:dev / verify:prod  -- click any time on a main pipeline. Runs the
#   full auth chain + read-only kubectl/AWS checks. Does not gate or trigger
#   the deploy chain. allow_failure: true so it never blocks.
#
# Auth chain (single-partition, cross-account in commercial AWS):
#   runner baseline identity
#     -> secrets.sh reads `awscommercialsecret` from Secrets Manager
#     -> aws sts assume-role into $ASSUME_ROLE_ARN (perkins account)
#     -> creds written to ~/.aws/credentials via `aws configure set` so they
#        persist across script lines (env-var inheritance is unreliable)
#     -> aws eks update-kubeconfig hits the perkins cluster
#
# Variables to set in GitLab:
#
# Project-level:
#   HTTPS_PROXY      http://10.111.225.254:8080
#   NO_PROXY         ngdc-gitlab-nonprod.fsa.mrd
#
# Per-environment (Settings -> CI/CD -> Variables, env-scoped, protected):
#   ASSUME_ROLE_ARN   arn:aws:iam::199570264848:role/<role>   |   arn:aws:iam::<prod-acct>:role/<role>
#   EKS_CLUSTER_NAME  gcralsp-development-primary-ekscluster  |   gcralsp-production-primary-ekscluster
#   AWS_REGION        us-east-1                               |   us-east-1
#
# Prereqs not managed here:
#   - cert-manager + metrics-server: EKS add-ons via perkins-infra
#   - Datadog secret `datadog/datadog`: out-of-band before first install
#   - secrets.sh in repo root: fetches deployer IAM user creds from Secrets Manager

variables:
  HELM_IMAGE: alpine/k8s:1.30.4
  HELM_TIMEOUT: 10m

stages:
  - validate
  - verify
  - approve-dev
  - deploy-dev
  - approve-prod
  - deploy-prod

# ----------------------------------------------------------------------
# matrix: keep in sync with charts/cluster/clusterCharts.yaml
# ----------------------------------------------------------------------

.matrix-wave-0: &matrix-wave-0
  - { RELEASE: istio-crds,            DIR: istio-crds,            NAMESPACE: istio-system, DEPS: "yes" }
.matrix-wave-1: &matrix-wave-1
  - { RELEASE: karpenter,             DIR: karpenter,             NAMESPACE: karpenter,    DEPS: "yes" }
  - { RELEASE: istiod,                DIR: istiod,                NAMESPACE: istio-system, DEPS: "yes" }
  - { RELEASE: datadog,               DIR: datadog-agent,         NAMESPACE: datadog,      DEPS: "yes" }
  - { RELEASE: nodelocal-dns,         DIR: nodelocal-dns,         NAMESPACE: kube-system,  DEPS: "no"  }
.matrix-wave-2: &matrix-wave-2
  - { RELEASE: istio-gateway,         DIR: istio-gateway,         NAMESPACE: istio-system, DEPS: "yes" }
  - { RELEASE: pgbouncer,             DIR: pgbouncer,             NAMESPACE: pgbouncer,    DEPS: "no"  }
.matrix-wave-3: &matrix-wave-3
  - { RELEASE: istio-gateway-objects, DIR: istio-gateway-objects, NAMESPACE: istio-system, DEPS: "no"  }

# ----------------------------------------------------------------------
# shared templates (use GitLab `extends:` -- avoid YAML merge keys)
# ----------------------------------------------------------------------

.common:
  image: $HELM_IMAGE

.main-only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Establishes commercial AWS creds via the cross-account assume-role and
# writes them to ~/.aws/credentials via `aws configure set`. The file is
# read fresh on each AWS CLI call, so cred persistence does not depend on
# env-var inheritance between script lines.
.aws-eks:
  extends: .common
  before_script:
    - echo "=================================================="
    - echo " Target environment : ${ENV:-verify}"
    - echo " Configured region  : ${AWS_REGION}"
    - echo " Configured cluster : ${EKS_CLUSTER_NAME}"
    - echo " Assume-role ARN    : ${ASSUME_ROLE_ARN}"
    - echo "=================================================="
    - |
      set -e
      source ./secrets.sh
      CREDS=$(aws sts assume-role \
        --region "$AWS_REGION" \
        --role-arn "$ASSUME_ROLE_ARN" \
        --role-session-name "gitlab-${CI_JOB_ID}" \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)
      AKID=$(echo "$CREDS" | awk '{print $1}')
      SKEY=$(echo "$CREDS" | awk '{print $2}')
      STOK=$(echo "$CREDS" | awk '{print $3}')
      unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_DEFAULT_REGION
      aws configure set aws_access_key_id     "$AKID"
      aws configure set aws_secret_access_key "$SKEY"
      aws configure set aws_session_token     "$STOK"
      aws configure set region                "$AWS_REGION"
    - aws sts get-caller-identity
    - aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

# ----------------------------------------------------------------------
# validate: helm template + "rendered something" guard, both envs, MR + main
# ----------------------------------------------------------------------

.template:
  extends: .common
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - CHART_DIR="charts/cluster/$DIR"
    - |
      if [ "$DEPS" = "yes" ]; then
        # register any https Chart.yaml deps as helm repos (OCI deps need no repo-add)
        yq -r '.dependencies // [] | .[] | select(.repository | test("^https?://")) | [.name, .repository] | @tsv' \
          "$CHART_DIR/Chart.yaml" | \
        while IFS=$'\t' read -r DEP_NAME DEP_URL; do
          [ -n "$DEP_URL" ] && helm repo add "$DEP_NAME" "$DEP_URL" 2>/dev/null || true
        done
        helm repo update >/dev/null 2>&1 || true
        helm dependency build "$CHART_DIR"
      fi    
    - |
      for env in dev prod; do
        VALUES_FILE="$CHART_DIR/values/$env/values.yaml"
        [ -f "$VALUES_FILE" ] || { echo "skip $RELEASE ($env): no values file"; continue; }
        echo "=== template $RELEASE ($env) ==="
        OUT="$(mktemp)"
        helm template "$RELEASE" "$CHART_DIR" \
          --namespace "$NAMESPACE" \
          -f "$VALUES_FILE" > "$OUT"
        COUNT=$(yq -e 'select(.kind != null) | .kind' "$OUT" 2>/dev/null | wc -l)
        echo "  rendered $COUNT resources"
        yq -e 'select(.kind != null) | [.kind, .metadata.namespace // "-", .metadata.name] | @tsv' "$OUT" 2>/dev/null || true
        if [ "$COUNT" -eq 0 ]; then
          echo "ERROR: $RELEASE ($env) rendered zero resources"; rm -f "$OUT"; exit 1
        fi
        rm -f "$OUT"
      done

template:wave-0: { extends: .template, parallel: { matrix: *matrix-wave-0 } }
template:wave-1: { extends: .template, parallel: { matrix: *matrix-wave-1 } }
template:wave-2: { extends: .template, parallel: { matrix: *matrix-wave-2 } }
template:wave-3: { extends: .template, parallel: { matrix: *matrix-wave-3 } }

# ----------------------------------------------------------------------
# verify: standalone "is the auth chain healthy + can we see the cluster"
# ----------------------------------------------------------------------

.verify:
  extends: .aws-eks
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual
  allow_failure: true
  needs: []
  script:
    - |
      echo "=================================================="
      echo " Target environment : ${ENV}"
      echo " Configured region  : ${AWS_REGION}"
      echo " Configured cluster : ${EKS_CLUSTER_NAME}"
      echo " Assume-role ARN    : ${ASSUME_ROLE_ARN}"
      echo "=================================================="
    - echo "== Who am I (effective identity after assume-role) =="
    - aws sts get-caller-identity --region "$AWS_REGION"
    - echo "== Where am I running (region / availability zone) =="
    - echo "AWS_REGION=${AWS_REGION:-unset} AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-unset}"
    - echo "== Does the target EKS cluster exist / what is its state =="
    - aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query 'cluster.{name:name,status:status,version:version,endpoint:endpoint}'
    - echo "== Kube context that would be used =="
    - kubectl config current-context
    - kubectl cluster-info
    - echo "== Can I reach the API / what nodes exist =="
    - kubectl get nodes -o wide
    - echo "== Existing namespaces =="
    - kubectl get namespaces
    - echo "Verification complete. No changes were made to the cluster."

verify:dev:
  extends: .verify
  environment: dev
  variables: { ENV: dev }

verify:prod:
  extends: .verify
  environment: prod
  variables: { ENV: prod }

# ----------------------------------------------------------------------
# deploy primitives: dry-run + apply
# ----------------------------------------------------------------------

.helm-dry-run:
  extends: [.aws-eks, .main-only]
  script:
    - CHART_DIR="charts/cluster/$DIR"
    - VALUES_FILE="$CHART_DIR/values/$ENV/values.yaml"
    - test -f "$VALUES_FILE" || { echo "missing $VALUES_FILE"; exit 1; }
    - if [ "$DEPS" = "yes" ]; then helm dependency build "$CHART_DIR"; fi
    - helm upgrade --install "$RELEASE" "$CHART_DIR"
        --namespace "$NAMESPACE"
        --create-namespace
        -f "$VALUES_FILE"
        --dry-run=server
        --debug

.helm-apply:
  extends: [.aws-eks, .main-only]
  script:
    - CHART_DIR="charts/cluster/$DIR"
    - VALUES_FILE="$CHART_DIR/values/$ENV/values.yaml"
    - if [ "$DEPS" = "yes" ]; then helm dependency build "$CHART_DIR"; fi
    - helm upgrade --install "$RELEASE" "$CHART_DIR"
        --namespace "$NAMESPACE"
        --create-namespace
        -f "$VALUES_FILE"
        --atomic
        --timeout "$HELM_TIMEOUT"

# ----------------------------------------------------------------------
# dev: approve -> (dry-run -> apply) x wave 0..3
# ----------------------------------------------------------------------

approve:dev:
  extends: [.common, .main-only]
  stage: approve-dev
  environment: dev
  when: manual
  allow_failure: false
  needs: []
  script: ['echo "dev deploy approved"']

dry-run:dev:wave-0:
  extends: .helm-dry-run
  stage: deploy-dev
  environment: dev
  variables: { ENV: dev }
  needs: ['approve:dev']
  parallel: { matrix: *matrix-wave-0 }

deploy:dev:wave-0:
  extends: .helm-apply
  stage: deploy-dev
  environment: dev
  variables: { ENV: dev }
  needs: ['dry-run:dev:wave-0']
  parallel: { matrix: *matrix-wave-0 }

dry-run:dev:wave-1:
  extends: .helm-dry-run
  stage: deploy-dev
  environment: dev
  variables: { ENV: dev }
  needs: ['deploy:dev:wave-0']
  parallel: { matrix: *matrix-wave-1 }

deploy:dev:wave-1:
  extends: .helm-apply
  stage: deploy-dev
  environment: dev
  variables: { ENV: dev }
  needs: ['dry-run:dev:wave-1']
  parallel: { matrix: *matrix-wave-1 }

dry-run:dev:wave-2:
  extends: .helm-dry-run
  stage: deploy-dev
  environment: dev
  variables: { ENV: dev }
  needs: ['deploy:dev:wave-1']
  parallel: { matrix: *matrix-wave-2 }

deploy:dev:wave-2:
  extends: .helm-apply
  stage: deploy-dev
  environment: dev
  variables: { ENV: dev }
  needs: ['dry-run:dev:wave-2']
  parallel: { matrix: *matrix-wave-2 }

dry-run:dev:wave-3:
  extends: .helm-dry-run
  stage: deploy-dev
  environment: dev
  variables: { ENV: dev }
  needs: ['deploy:dev:wave-2']
  parallel: { matrix: *matrix-wave-3 }

deploy:dev:wave-3:
  extends: .helm-apply
  stage: deploy-dev
  environment: dev
  variables: { ENV: dev }
  needs: ['dry-run:dev:wave-3']
  parallel: { matrix: *matrix-wave-3 }

# ----------------------------------------------------------------------
# prod: approve (gated on dev success) -> (dry-run -> apply) x wave 0..3
# ----------------------------------------------------------------------

approve:prod:
  extends: [.common, .main-only]
  stage: approve-prod
  environment: prod
  when: manual
  allow_failure: false
  needs: ['deploy:dev:wave-3']
  script: ['echo "prod deploy approved"']

dry-run:prod:wave-0:
  extends: .helm-dry-run
  stage: deploy-prod
  environment: prod
  variables: { ENV: prod }
  needs: ['approve:prod']
  parallel: { matrix: *matrix-wave-0 }

deploy:prod:wave-0:
  extends: .helm-apply
  stage: deploy-prod
  environment: prod
  variables: { ENV: prod }
  needs: ['dry-run:prod:wave-0']
  parallel: { matrix: *matrix-wave-0 }

dry-run:prod:wave-1:
  extends: .helm-dry-run
  stage: deploy-prod
  environment: prod
  variables: { ENV: prod }
  needs: ['deploy:prod:wave-0']
  parallel: { matrix: *matrix-wave-1 }

deploy:prod:wave-1:
  extends: .helm-apply
  stage: deploy-prod
  environment: prod
  variables: { ENV: prod }
  needs: ['dry-run:prod:wave-1']
  parallel: { matrix: *matrix-wave-1 }

dry-run:prod:wave-2:
  extends: .helm-dry-run
  stage: deploy-prod
  environment: prod
  variables: { ENV: prod }
  needs: ['deploy:prod:wave-1']
  parallel: { matrix: *matrix-wave-2 }

deploy:prod:wave-2:
  extends: .helm-apply
  stage: deploy-prod
  environment: prod
  variables: { ENV: prod }
  needs: ['dry-run:prod:wave-2']
  parallel: { matrix: *matrix-wave-2 }

dry-run:prod:wave-3:
  extends: .helm-dry-run
  stage: deploy-prod
  environment: prod
  variables: { ENV: prod }
  needs: ['deploy:prod:wave-2']
  parallel: { matrix: *matrix-wave-3 }

deploy:prod:wave-3:
  extends: .helm-apply
  stage: deploy-prod
  environment: prod
  variables: { ENV: prod }
  needs: ['dry-run:prod:wave-3']
  parallel: { matrix: *matrix-wave-3 }
