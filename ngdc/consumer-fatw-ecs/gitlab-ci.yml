# =============================================================================
# Your pipeline, structure preserved. Changes are marked  # <-- CHANGED / NEW
# and explained in ../README.md. Everything else is byte-for-byte your shape:
# same stages, same anchors, same EKS_RUNNER_GITLAB tag, same TF_ROOT, same
# workspace + ecs.tfvars calls.
# =============================================================================

stages:
  - validate
  - plan
  - deploy
  - cleanup
  # - destroy

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/dev
  TF_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${CI_PROJECT_NAME}
  TF_PLUGIN_CACHE_DIR: "/deployment-scripts/terraform-providers/plugin-cache/${CI_PROJECT_DIR}/dev"
  TF_CLI_CONFIG_FILE: "${CI_PROJECT_DIR}/dev/.terraformrc"
  GIT_STRATEGY: clone
  GIT_SSL_NO_VERIFY: "true"
  TF_VAR_gitlab_project: $CI_PROJECT_PATH/dev

  # NEW: module registry host + pinned versions. Bumping a module is now a
  # reviewable one-line diff instead of a branch ref that moves under you.
  MODULE_REGISTRY: "gitlab.example.com"
  ECS_CLUSTER_MODULE_VERSION: "2.4.0"
  DATADOG_MODULE_VERSION: "1.0.0"

  # NEW: rendered into main.tf by envsubst.
  SERVICE_NAME: "fatw-api"
  ENVIRONMENT: "dev"

.common: &common
  tags:
    - EKS_RUNNER_GITLAB

.cache: &cache
  cache:
    key: "${TF_ROOT}"
    paths:
      - ${TF_ROOT}/.terraform/

before_script:
  - cd ${TF_ROOT}/
  - export PATH="/deployment-scripts/terraform-providers/bin:$PATH"
  - mkdir -p ${TF_PLUGIN_CACHE_DIR}/dev
  # CHANGED: restrict envsubst to an explicit allowlist. Bare envsubst blanks
  # any dotless ${NAME} in the template, which is a live landmine every time
  # someone adds a Terraform expression like ${count} or ${path}.
  - envsubst '$MODULE_REGISTRY $CI_JOB_TOKEN' < .terraformrc.tmpl > .terraformrc
  - envsubst '$MODULE_REGISTRY $ECS_CLUSTER_MODULE_VERSION $DATADOG_MODULE_VERSION $SERVICE_NAME $ENVIRONMENT'
      < main.tf.tmpl > main.tf
  - aws sts get-caller-identity
  # NEW: image_tag drives the running image AND DD_VERSION, so every trace,
  # log line and metric carries the deployed SHA.
  - export TF_VAR_image_tag="${IMAGE_TAG:-$CI_COMMIT_SHORT_SHA}"
  - export TF_VAR_change_ticket="${CHANGE_TICKET:-unset}"

.plan: &plan
  <<: *common
  <<: *cache
  script:
    - terraform init
    - terraform workspace select -or-create $ENV_NAME
    # CHANGED: -out=tfplan. See .apply for why this matters.
    - terraform plan -var-file ecs.tfvars -out=tfplan
    - terraform show -no-color tfplan > plan.txt
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
      - ${TF_ROOT}/plan.txt
      - ${TF_ROOT}/main.tf
    expire_in: 7 days

.apply: &apply
  <<: *common
  <<: *cache
  script:
    - terraform init
    - terraform workspace select -or-create $ENV_NAME
    # CHANGED: apply the SAVED plan rather than re-planning with
    # `apply -auto-approve -var-file`. As written today, deploy computes a
    # fresh plan at apply time, so what a reviewer approved in the plan job is
    # not necessarily what gets applied -- and the manual gate is approving a
    # plan that no longer exists. Applying tfplan closes that gap.
    - terraform apply -auto-approve tfplan
    # NEW: post-deploy sanity. Confirms the sidecars actually registered.
    - |
      TD=$(terraform output -raw task_definition_arn)
      aws ecs describe-task-definition --task-definition "$TD" \
        --query 'taskDefinition.containerDefinitions[].name' --output text

# .destroy: &destroy
#   <<: *common
#   <<: *cache
#   script:
#     - terraform init
#     - export HTTPS_PROXY=10.111.225.254:8080
#     - terraform workspace select -or-create $ENV_NAME
#     - terraform destroy -auto-approve -var-file ecs.tfvars

validate:
  <<: *common
  stage: validate
  script:
    - terraform init
    - terraform validate
    # NEW: catches template-rendering damage before it reaches plan.
    - terraform fmt -check -diff main.tf

plan:
  needs:
    - validate
  stage: plan
  <<: *plan
  variables:
    ENV_NAME: FATW-DEV

deploy:
  when: manual
  # only:
  #   - main
  needs:
    - validate
    - plan
  stage: deploy
  <<: *apply
  variables:
    ENV_NAME: FATW-DEV
