# Module repo pipeline.
# MRs: format + validate + lint + scan + docs drift.
# Tags (vX.Y.Z on main): publish to the GitLab Terraform Module Registry so
# consumers pin a version instead of a git ref.

stages:
  - validate
  - scan
  - release

variables:
  TF_VERSION: "1.9.8"
  TERRAFORM_MODULE_NAME: "datadog-ecs-sidecar"
  TERRAFORM_MODULE_SYSTEM: "aws"

default:
  image: hashicorp/terraform:${TF_VERSION}
  before_script:
    - terraform --version

# -----------------------------------------------------------------------------
fmt:
  stage: validate
  script:
    - terraform fmt -check -recursive -diff
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

validate:
  stage: validate
  script:
    # No backend, no credentials: this module has no provider block, so
    # `validate` works standalone. That is a feature, not an accident.
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

tflint:
  stage: validate
  image: ghcr.io/terraform-linters/tflint:latest
  entrypoint: [""]
  script:
    - tflint --init
    - tflint --format compact
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# -----------------------------------------------------------------------------
trivy_iac:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy config --exit-code 1 --severity HIGH,CRITICAL .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

docs_drift:
  stage: scan
  image:
    name: quay.io/terraform-docs/terraform-docs:latest
    entrypoint: [""]
  script:
    - terraform-docs markdown table --output-file README.md --output-mode inject .
    - git diff --exit-code README.md || (echo "README.md is stale - run terraform-docs locally"; exit 1)
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# -----------------------------------------------------------------------------
publish:
  stage: release
  image: curlimages/curl:latest
  before_script: []
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - tar -czf ${TERRAFORM_MODULE_NAME}-${TERRAFORM_MODULE_SYSTEM}-${VERSION}.tgz
        --exclude=.git --exclude=.gitlab-ci.yml .
    - |
      curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file ${TERRAFORM_MODULE_NAME}-${TERRAFORM_MODULE_SYSTEM}-${VERSION}.tgz \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/terraform/modules/${TERRAFORM_MODULE_NAME}/${TERRAFORM_MODULE_SYSTEM}/${VERSION}/file"
  rules:
    # Only annotated semver tags on the default branch produce a release.
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
