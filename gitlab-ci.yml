stages:
  - k8s-deploy
  - checks
  - cleanup

variables:
  TF_ROOT: ${CI_PROJECT_DIR}
  GIT_STRATEGY: clone
  GIT_SSL_NO_VERIFY: "true"

.common: &common
  tags:
    - EKS_RUNNER_GITLAB

.default-cluster-auth:
  <<: *common
  before_script:
    # set proxy if needed
    - export HTTPS_PROXY=10.111.225.254:8080
    - export NO_PROXY=".sk1.us-gov-west-1.eks.amazonaws.com"

    # get cluster & account info
    - export CLUSTER_NAME=NGDC-FPS-EKS-cluster
    - export AWS_ACCOUNT=093737011827

    ## assume the Admin role exactly once
    - |
      read AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<< \
        $(aws sts assume-role \
          --role-arn arn:aws-us-gov:iam::${AWS_ACCOUNT}:role/NGDCGitLabTerraformAdminRole \
          --role-session-name gitlab-ci \
          --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
          --output text)
    - export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN

    # sanity-check
    - aws sts get-caller-identity

    # now update kubeconfig (uses the assumed creds)
    - aws eks update-kubeconfig --name="${CLUSTER_NAME}" --region=us-gov-west-1

# Now your real jobs just extend that template
kubectl-get-pods:
  extends: .default-cluster-auth
  when: manual
  stage: checks
  script:
    - cat /proc/net/dev
    - kubectl get pods -A -o wide
  variables:
    ENV_NAME: cnc

kubectl-get-nodes:
  extends: .default-cluster-auth
  when: manual
  stage: checks
  script:
    - cat /proc/net/dev
    - kubectl get nodes
  variables:
    ENV_NAME: cnc

# 1) Check overall cluster status
aws-check-cluster-status:
  extends: .default-cluster-auth
  when: manual
  stage: checks
  script:
    - echo "Cluster status:"
    - aws eks describe-cluster --name "${CLUSTER_NAME}" --region us-gov-west-1 --query "cluster.status"
    - aws eks describe-cluster --name "${CLUSTER_NAME}" --region us-gov-west-1 --query "cluster.identity.oidc.issuer"
  variables:
    ENV_NAME: cnc

# 2) List all node-groups
aws-list-nodegroups:
  extends: .default-cluster-auth
  when: manual
  stage: checks
  script:
    - echo "Node groups:"
    - aws eks list-nodegroups --cluster-name "${CLUSTER_NAME}" --region us-gov-west-1
  variables:
    ENV_NAME: cnc

# -----------------------------------------------------------------------------
# Datadog Synthetics Private Location worker
# Separate Helm release from the existing Datadog Operator / DatadogAgent.
# Chart:      datadog/synthetics-private-location  (NOT datadog/datadog-private-location)
# Namespace:  datadog-synthetics  (dedicated; isolates from the Operator namespace)
# Release:    datadog-synthetics-private-location
# K8s Secret: datadog-synthetics-private-location-config
# JSON source: AWS Secrets Manager (us-gov-west-1).
#   - Secret name (DD_AWS_SECRET_ID below) must already exist with the entire
#     synthetics-check-runner.json content as the SecretString.
#   - Read access is granted to NGDCGitLabTerraformAdminRole.
# The JSON is never committed to Git and never written under ${CI_PROJECT_DIR}.
# -----------------------------------------------------------------------------

.dd-pl-vars: &dd-pl-vars
  ENV_NAME: cnc
  DD_NAMESPACE: datadog-synthetics
  DD_RELEASE_NAME: datadog-synthetics-private-location
  DD_CONFIG_SECRET_NAME: datadog-synthetics-private-location-config
  DD_WORKER_VALUES: datadog_synthetics_private_location/values.yaml
  # The worker JSON is stored in AWS Secrets Manager and fetched at deploy time
  # using the role already assumed by .default-cluster-auth.
  # DD_AWS_SECRET_ID is the AWS Secrets Manager secret name or full ARN.
  # The SecretString must be the entire synthetics-check-runner.json contents.
  DD_AWS_SECRET_ID: datadog/synthetics/private-location-runner-json
  DD_TMP_JSON_PATH: /tmp/synthetics-check-runner.${CI_JOB_ID}.json

check-datadog-private-location-prereqs:
  extends: .default-cluster-auth
  when: manual
  stage: checks
  variables:
    <<: *dd-pl-vars
  script:
    - command -v aws
    - command -v kubectl
    - command -v helm
    - command -v jq
    - kubectl get nodes
    # Confirm the AWS Secrets Manager secret exists and is accessible to the
    # assumed role. describe-secret returns metadata only, NOT the value.
    - |
      aws secretsmanager describe-secret \
        --secret-id "${DD_AWS_SECRET_ID}" \
        --region "${AWS_REGION:-us-gov-west-1}" \
        --query '{Name:Name,ARN:ARN,LastChangedDate:LastChangedDate}' \
        --output table
      echo "AWS Secrets Manager secret '${DD_AWS_SECRET_ID}' is accessible."

helm-deploy-datadog-private-location:
  extends: .default-cluster-auth
  when: manual
  stage: k8s-deploy
  variables:
    <<: *dd-pl-vars
  script:
    - helm repo add datadog https://helm.datadoghq.com
    - helm repo update
    - kubectl create namespace "${DD_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
    - |
      set +x
      umask 077

      # Pull the worker JSON from AWS Secrets Manager into a job-scoped temp file.
      # --output text writes the raw SecretString; redirection keeps it out of logs.
      aws secretsmanager get-secret-value \
        --secret-id "${DD_AWS_SECRET_ID}" \
        --region "${AWS_REGION:-us-gov-west-1}" \
        --query SecretString \
        --output text > "${DD_TMP_JSON_PATH}"
      chmod 600 "${DD_TMP_JSON_PATH}"
      test -s "${DD_TMP_JSON_PATH}"

      kubectl create secret generic "${DD_CONFIG_SECRET_NAME}" \
        --namespace "${DD_NAMESPACE}" \
        --from-file=synthetics-check-runner.json="${DD_TMP_JSON_PATH}" \
        --dry-run=client \
        -o yaml |
        kubectl apply -f -

      shred -u "${DD_TMP_JSON_PATH}" 2>/dev/null || rm -f "${DD_TMP_JSON_PATH}"
    - |
      helm upgrade --install "${DD_RELEASE_NAME}" \
        datadog/synthetics-private-location \
        --namespace "${DD_NAMESPACE}" \
        --values "${DD_WORKER_VALUES}" \
        --atomic \
        --wait \
        --timeout 10m
    - helm list --namespace "${DD_NAMESPACE}"
    - kubectl get deployments,pods,pdb --namespace "${DD_NAMESPACE}" -o wide
  after_script:
    # Always remove the temp JSON file, even on failure or early exit.
    - rm -f "${DD_TMP_JSON_PATH}" || true

check-datadog-private-location-status:
  extends: .default-cluster-auth
  when: manual
  stage: checks
  variables:
    <<: *dd-pl-vars
  script:
    - helm status "${DD_RELEASE_NAME}" --namespace "${DD_NAMESPACE}"
    - kubectl get deployments,pods,pdb --namespace "${DD_NAMESPACE}" -o wide
    # Confirm the required key is present in the Secret WITHOUT exposing its value.
    - |
      kubectl get secret "${DD_CONFIG_SECRET_NAME}" \
        --namespace "${DD_NAMESPACE}" \
        -o jsonpath='{.data}' |
        jq 'keys'
    - |
      kubectl logs \
        --namespace "${DD_NAMESPACE}" \
        --selector="app.kubernetes.io/instance=${DD_RELEASE_NAME}" \
        --tail=100 \
        --prefix

cleanup-datadog-private-location:
  extends: .default-cluster-auth
  when: manual
  stage: cleanup
  variables:
    <<: *dd-pl-vars
  script:
    # Removes ONLY the synthetics private-location release and its config Secret.
    # Does NOT touch: the Datadog Operator, DatadogAgent CR, datadog-secret,
    # or any resource in the 'datadog' namespace.
    - helm uninstall "${DD_RELEASE_NAME}" --namespace "${DD_NAMESPACE}" || true
    - kubectl delete secret "${DD_CONFIG_SECRET_NAME}" --namespace "${DD_NAMESPACE}" --ignore-not-found
